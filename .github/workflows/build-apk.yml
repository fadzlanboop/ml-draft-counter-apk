name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependency npm
        run: npm install

      - name: Buat project Android via Capacitor
        run: |
          npx cap init "ML Draft Counter" "com.oo.mldraftcounter" --web-dir=www || true
          npx cap add android || true

      - name: Pasang kode native bubble mengambang
        run: |
          mkdir -p android/app/src/main/java/com/oo/mldraftcounter
          cp android-native/OverlayBridgePlugin.java android/app/src/main/java/com/oo/mldraftcounter/OverlayBridgePlugin.java
          cp android-native/FloatingBubbleService.java android/app/src/main/java/com/oo/mldraftcounter/FloatingBubbleService.java
          cp android-native/MainActivity.java android/app/src/main/java/com/oo/mldraftcounter/MainActivity.java
          cp android-native/AndroidManifest_full.xml android/app/src/main/AndroidManifest.xml

      - name: Sinkronkan project Android (setelah kode native terpasang)
        run: npx cap sync android

      - name: Verifikasi file native ter-copy
        run: |
          echo "Isi folder Java custom:"
          ls -la android/app/src/main/java/com/oo/mldraftcounter/
          echo "--- Isi AndroidManifest.xml (cek ada FloatingBubbleService) ---"
          grep -A2 "FloatingBubbleService" android/app/src/main/AndroidManifest.xml || echo "TIDAK DITEMUKAN di manifest!"

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK sebagai hasil build
        uses: actions/upload-artifact@v4
        with:
          name: ml-draft-counter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
